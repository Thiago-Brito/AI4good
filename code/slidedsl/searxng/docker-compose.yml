# SearXNG local para a pesquisa da SlideDSL (metabusca: Google, Bing, DuckDuckGo, Wikipedia...).
# Uso: scripts\iniciar_searxng.cmd  (ou: docker compose -f searxng/docker-compose.yml up -d)
services:
  searxng:
    image: searxng/searxng:latest
    container_name: slidedsl-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"   # só acessível deste computador
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    env_file:
      - ./.env  # gerado pelo script; ignorado pelo Git
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
