[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slidedsl"
version = "1.1.0"
description = "Compilador determinístico de português controlado para PowerPoint editável"
requires-python = ">=3.12"
dependencies = ["lark==1.2.2", "pydantic==2.11.7", "PyYAML==6.0.2", "fastapi==0.115.12", "uvicorn==0.34.3", "httpx==0.28.1", "jsonschema==4.24.0", "Pillow==12.3.0", "pypdf==6.20.0", "psutil==7.1.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.0"]

[project.scripts]
slidedsl = "slidedsl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slidedsl = ["grammar/*.lark", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

